[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnapps-audio-chat"
version = "0.1.0"
description = "wdnwebui 音频类应用插件：语音生成 + 流式语音识别"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pyrk-sdk" }]

# 刻意不声明 wdnwebui 依赖：宿主不是 PyPI 包，是同一个 .venv 里
# 从仓库根直接跑的 FastAPI 服务（run.py → app.main:app）。卡片代码
# import 的是 `app.core.*`，由 wdnwebui 自己的启动脚本把仓库根放进
# sys.path。把 wdnwebui 写进 dependencies 会让 pip 去 PyPI 找一个
# 不存在的同名包并直接安装失败。
#
# 真要表达这层耦合，宿主侧的插件发现通道（app/core/manifest.py 的
# `_discover_from_entry_points`）才是它的位置：它 import 本包失败
# 时只 LOG.error 并跳过，不会拖垮整个 web UI。
dependencies = [
    "pydantic>=1.10",
    "fastapi>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/rockchip-wardner/wdnapps_audio_chat"
Repository = "https://github.com/rockchip-wardner/wdnapps_audio_chat"
Issues = "https://github.com/rockchip-wardner/wdnapps_audio_chat/issues"

# ---------------------------------------------------------------------------
# 插件注册表 —— wdnwebui manifest 加载器唯一识别的 group
#
#   左边 = 卡片 id，必须与该卡 manifest.json 里的 "id" 逐字相同
#           （宿主会做一致性校验，不一致直接 FATAL 跳过该卡）。
#   右边 = 可 import 的卡片模块；宿主据此定位卡片目录
#           （模块所在目录 + /manifest.json + /static/）
# ---------------------------------------------------------------------------
[project.entry-points."wdnwebui.cards"]
"tts" = "wdnapps_audio_chat.cards.tts"
"qwen3-asr" = "wdnapps_audio_chat.cards.qwen3_asr"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnapps_audio_chat*"]
exclude = ["tests*"]

# 关键：template.html / app.js / app.css / wizard.json 必须进 wheel，
# 否则宿主挂载 /static/apps/<id> 时目录是空的（卡片仍会被发现，
# 但前端 404 —— 这正是插件化最容易踩且最难一眼看出的坑）。
#
# 试听样例在 **static/previews/** 子目录里：`static/*` 这条 glob 只
# 匹配 static 下的直接子项，匹配不到 previews/ 里的 *.wav —— 少写
# 一条的表现是「卡片正常，但试听 404」，且 editable 装法下完全看不出来
# （读的是源码树），只有真 wheel 才暴露。
#
# qwen3-asr 卡的 static/ 下还有 **capture-worklet.js**（AudioWorkletProcessor
# 必须独立成文件）—— 它在 static 的直接子项里，`static/*` 覆盖得到；
# preview.mp4 同理。
[tool.setuptools.package-data]
"wdnapps_audio_chat.cards.tts" = ["manifest.json", "static/*", "static/previews/*"]
"wdnapps_audio_chat.cards.qwen3_asr" = ["manifest.json", "static/*"]
